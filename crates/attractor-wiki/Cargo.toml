[package]
name = "attractor-wiki"
version = "0.0.0"
edition = "2021"
# Local filesystem materializer plus the gated publish boundary. Live IO is
# behind explicit caller opt-in and a transport trait so tests stay no-network.
# Follows the Rust 1.96 store/projector leg because batch manifests run the
# issue-wiki projector before local materialization.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Issue-wiki write, publish, and batch-driver boundary with frozen manifests and durable receipts."
repository = "https://github.com/gwild/attractor"

[dependencies]
attractor-projector = { path = "../attractor-projector" }
attractor-proto = { path = "../attractor-proto" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
