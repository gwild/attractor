[package]
name = "attractor-io"
version = "0.0.0"
edition = "2021"
# Held at the 1.92 floor + dep-light on purpose: the portable half (ShmControl,
# the Rust<->Python control-file contract) attests on both legs alongside
# core/proto. The mmap/`/dev/shm` writer is `cfg(unix)`-gated — Linux-only —
# so this crate still *compiles* cross-platform (an empty shell on Windows)
# while the actual shared-memory export runs on Homer/Linux.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Linux-targeted Rust->Python shared-memory export for Attractor (audmon /dev/shm + control-file pattern). Portable ShmControl contract + cfg(unix) mmap writer; data-model-agnostic transport."
repository = "https://github.com/gwild/attractor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mmap is only used on the Unix shared-memory path; keep it off the Windows
# attestation build so the portable half stays dep-light.
[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"
