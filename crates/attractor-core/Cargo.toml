[package]
name = "attractor-core"
version = "0.0.0"
edition = "2021"
# Lowest fleet Rust (Windy's Windows-native). The cross-platform attestation
# legs (Homer `cargo +1.92`, Windows native 1.92) verify AT this floor — a pin
# alone is informational and wouldn't catch own-code drift on a newer toolchain.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Pure schema + blake3 content-addressing for the Attractor matrix. No async/web/OS deps — the cross-platform-attested core layer."
repository = "https://github.com/gwild/attractor"

[dependencies]
# The frozen WS-1 wire contract (`SourceSpan`/`E2eReceipt`, #14) that the
# markdown source-map (#2343) lowers into. Same 1.92 floor, pure serde — keeps
# core attestable on every fleet platform.
attractor-proto = { path = "../attractor-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Pure, cross-platform, low-MSRV. NFKC folding so injection patterns can't hide
# behind compatibility/full-width variants (#2213 review, Ivy).
unicode-normalization = "0.1"
